[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "persian-tabular-cleaner"
version = "0.1.0"
description = "Clean and standardize Persian CSV and Excel data with an auditable report."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sina Adljoo" }]
keywords = ["persian", "farsi", "data-cleaning", "csv", "excel", "jalali"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pandas>=2.1,<3.0",
  "openpyxl>=3.1,<4.0",
  "persiantools>=4.0,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
persian-clean = "persian_tabular_cleaner.cli:main"

[project.urls]
Homepage = "https://github.com/Elenor274/persian-tabular-cleaner"
Issues = "https://github.com/Elenor274/persian-tabular-cleaner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/persian_tabular_cleaner"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
