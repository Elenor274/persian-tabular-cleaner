name: Bug report
description: Report a reproducible data-cleaning problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. Never attach customer or confidential files.
  - type: textarea
    id: sample
    attributes:
      label: Minimal synthetic example
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Package version, Python version, operating system
    validations:
      required: true
